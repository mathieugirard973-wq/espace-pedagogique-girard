<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory — Memory des mots</title><style>
:root{--navy:#10243e;--gold:#d0a43e;--ink:#15283f;--line:#d7e1ec;--bg:#f5f7fa}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}main{max-width:800px;margin:auto;padding:19px}h1{font-size:23px;margin:0 0 5px}p{font-size:12px;color:#637286;margin:0 0 18px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:13px}.stats{font-size:13px;font-weight:800;color:#465b73}.stats strong{color:#987018}button{font:inherit;cursor:pointer}button.retry{border:0;border-radius:9px;padding:9px 14px;background:var(--gold);color:#16253a;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.tile{position:relative;height:94px;border:2px solid #446489;border-radius:13px;background:linear-gradient(145deg,#204366,#10243e);display:grid;place-items:center;color:#f3cb63;box-shadow:0 4px 10px #15253b1c;transition:transform .15s,background .15s;font-weight:800;line-height:1.3}.tile:not(:disabled):hover{transform:translateY(-2px)}.tile:focus-visible,.retry:focus-visible{outline:3px solid #d0a43e;outline-offset:2px}.tile.revealed,.tile.matched{background:#fff;border-color:#d5a948;color:#10243e}.tile.matched{border-color:#6b9b82;background:#f0faf5;color:#1c5b40}.tile .front{font-size:28px}.tile .back{font-size:clamp(12px,2vw,16px);padding:6px;display:none}.tile.revealed .front,.tile.matched .front{display:none}.tile.revealed .back,.tile.matched .back{display:block}.hint{margin:12px 0 0;padding:12px 14px;background:#fff;border-radius:11px;border:1px solid var(--line);font-size:12px}.record{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 0;font-size:12px;color:#53647b}.record input{width:17px;height:17px;accent-color:#9b7222}.result{font-weight:800;color:#1c6b49;margin:12px 0}.note{font-size:11px;color:#637286;margin-top:10px}@media(max-width:500px){main{padding:13px}.grid{gap:7px}.tile{height:80px}.tile .back{font-size:12px}.stats{font-size:11px}.toolbar{padding:10px}h1{font-size:20px}}
</style></head><body><main><h1>Memory des mots</h1><p>Retourne deux cartes pour trouver les paires. L’activité fonctionne entièrement hors ligne.</p><div class="toolbar"><div class="stats">Coups : <strong id="moves">0</strong> &nbsp;•&nbsp; Paires : <strong id="pairs">0</strong>/6</div><button type="button" class="retry" id="retry">Recommencer</button></div><div class="grid" id="grid" aria-label="Cartes de Memory"></div><div class="hint" id="hint" aria-live="polite">Choisis deux cartes pour commencer.</div><label class="record"><input type="checkbox" id="save"> Mémoriser mon meilleur score sur cet appareil</label><div class="note" id="best">Enregistrement désactivé. Sur un ordinateur partagé, laisse cette case décochée.</div><div class="result" id="result" role="status"></div></main>
<script>
(()=>{'use strict';const pairs=[["a", "verbe avoir"], ["à", "préposition"], ["on", "pronom"], ["ont", "verbe avoir (pluriel)"], ["est", "verbe être"], ["et", "conjonction"]];const key='mg-v2-memory-mots-best';let cards=[],turned=[],matched=0,moves=0,locked=false;const $=id=>document.getElementById(id);const shuffled=arr=>arr.map(value=>({value,rand:Math.random()})).sort((a,b)=>a.rand-b.rand).map(x=>x.value);
function readBest(){if(!$('save').checked){$('best').textContent='Enregistrement désactivé. Sur un ordinateur partagé, laisse cette case décochée.';return}try{const val=localStorage.getItem(key);$('best').textContent=val?'Meilleur résultat sur cet appareil : '+val+' coups.':'Aucun résultat enregistré sur cet appareil.'}catch(e){$('best').textContent='Enregistrement local indisponible dans ce navigateur.'}}
function restart(){const data=pairs.flatMap((p,i)=>[{id:i,text:p[0]},{id:i,text:p[1]}]);cards=shuffled(data);turned=[];matched=0;moves=0;locked=false;$('moves').textContent='0';$('pairs').textContent='0';$('hint').textContent='Choisis deux cartes pour commencer.';$('result').textContent='';$('grid').innerHTML=cards.map((c,i)=>`<button type="button" class="tile" data-index="${i}" aria-label="Carte cachée ${i+1}" aria-pressed="false"><span class="front" aria-hidden="true">◆</span><span class="back">${c.text}</span></button>`).join('')}
function click(e){const btn=e.target.closest('.tile');if(!btn||btn.disabled||locked)return;const i=Number(btn.dataset.index);if(turned.some(x=>x.index===i))return;btn.classList.add('revealed');btn.setAttribute('aria-pressed','true');btn.setAttribute('aria-label',cards[i].text);turned.push({...cards[i],index:i});if(turned.length<2)return;moves++;$('moves').textContent=moves;locked=true;const [a,b]=turned;const matchedPair=a.id===b.id;if(matchedPair){for(const x of turned){const node=$('grid').children[x.index];node.classList.remove('revealed');node.classList.add('matched');node.disabled=true;node.setAttribute('aria-label','Paire trouvée : '+x.text)}matched++;$('pairs').textContent=matched;$('hint').textContent='Paire trouvée !';turned=[];locked=false;if(matched===pairs.length){$('result').textContent='Partie terminée ! '+moves+' coups pour '+matched+' paires.';if($('save').checked)try{const prev=Number(localStorage.getItem(key))||Infinity;if(moves<prev)localStorage.setItem(key,String(moves))}catch(e){}readBest()}return}window.setTimeout(()=>{for(const x of turned){const node=$('grid').children[x.index];node.classList.remove('revealed');node.setAttribute('aria-pressed','false');node.setAttribute('aria-label','Carte cachée '+(x.index+1))}turned=[];locked=false;$('hint').textContent='Continue à chercher les paires.'},850)}
$('grid').addEventListener('click',click);$('retry').addEventListener('click',restart);$('save').addEventListener('change',readBest);restart();readBest();
})();</script></body></html>
