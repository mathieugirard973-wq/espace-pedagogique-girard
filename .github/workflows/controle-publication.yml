name: Vérifier la réactivation du site
on:
  push:
    paths:
      - '.github/workflows/controle-publication.yml'
permissions:
  contents: read
  pages: write
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier GitHub Pages et demander la mise en ligne
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url,status,source,build_type}'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status,url}'
