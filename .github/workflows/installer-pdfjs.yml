name: Installer le moteur PDF.js local
on:
  push:
    paths:
      - '.github/workflows/installer-pdfjs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Télécharger PDF.js depuis npm et vérifier les fichiers
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm pack pdfjs-dist@4.10.38 --pack-destination "$tmp" --silent
          tar -xzf "$tmp/pdfjs-dist-4.10.38.tgz" -C "$tmp"
          mkdir -p assets/vendor/pdfjs
          cp "$tmp/package/build/pdf.min.mjs" assets/vendor/pdfjs/pdf.min.mjs
          cp "$tmp/package/build/pdf.worker.min.mjs" assets/vendor/pdfjs/pdf.worker.min.mjs
          cp "$tmp/package/LICENSE" assets/vendor/pdfjs/LICENSE.txt
          test "$(wc -c < assets/vendor/pdfjs/pdf.min.mjs)" -gt 150000
          test "$(wc -c < assets/vendor/pdfjs/pdf.worker.min.mjs)" -gt 300000
          sha256sum assets/vendor/pdfjs/pdf.min.mjs assets/vendor/pdfjs/pdf.worker.min.mjs
          ls -lh assets/vendor/pdfjs
      - name: Enregistrer les dépendances dans le dépôt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/pdfjs
          if ! git diff --cached --quiet; then
            git commit -m "Conserver PDF.js 4.10.38 et son worker localement"
            git push origin HEAD:main
          fi
