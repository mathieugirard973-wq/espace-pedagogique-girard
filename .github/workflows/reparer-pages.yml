name: Diagnostiquer et débloquer GitHub Pages
on:
  push:
    paths:
      - '.github/workflows/reparer-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  deblocage:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostiquer et annuler la publication bloquée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="repos/${GITHUB_REPOSITORY}/pages/deployments/32872e52d0cfada7fc1100f5dbbfaddd19c67bf4"
          for attempt in 1 2 3; do
            echo "Tentative ${attempt}: statut actuel"
            gh api "$target" --jq '.status' || true
            echo "Demande d'annulation"
            gh api -X POST "$target/cancel"
            sleep 12
          done
          echo "Statut après annulation"
          gh api "$target" --jq '.status' || true
      - name: Demander une nouvelle construction Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
