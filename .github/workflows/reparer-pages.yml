name: Libérer la publication GitHub Pages
on:
  push:
    paths:
      - '.github/workflows/reparer-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
jobs:
  liberation:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer l'ancien déploiement défaillant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/7555713052"
          echo "Ancien déploiement supprimé"
          gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/32872e52d0cfada7fc1100f5dbbfaddd19c67bf4" --jq '.status' || true
      - name: Relancer GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
