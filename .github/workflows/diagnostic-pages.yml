name: Réactiver GitHub Pages sur main
on:
  push:
    paths:
      - '.github/workflows/diagnostic-pages.yml'
permissions:
  contents: read
  pages: write
jobs:
  reactivation:
    runs-on: ubuntu-latest
    steps:
      - name: Activer Pages si absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url'; then
            echo "Pages existe déjà"
          else
            echo "Pages absent : création depuis main et /"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=main" -f "source[path]=/" --jq '{html_url, status, source, build_type}'
          fi
      - name: Vérifier la configuration finale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url, status, source, build_type}'
