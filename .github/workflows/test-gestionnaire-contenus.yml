name: Intégrité du catalogue et nouvelles séances
on:
  push:
    paths:
      - '.github/workflows/test-gestionnaire-contenus.yml'
      - 'assets/js/site.js'
      - 'contenus/catalogue.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les séances, ressources et liens internes
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const vm=require('node:vm');
          const source=fs.readFileSync('contenus/catalogue.js','utf8');
          const window={};
          vm.runInNewContext(source,{window});
          const data=window.PORTAIL_CATALOGUE;
          assert.equal(data.subjects.length,7);
          assert(Array.isArray(data.sequences)&&Array.isArray(data.sessions));
          const ids=new Set();
          for(const seq of data.sequences){
            assert(seq.id&&seq.title&&Array.isArray(seq.sessions));
            assert(!ids.has(seq.id));ids.add(seq.id);
            for(const id of seq.sessions)assert(data.sessions.some(x=>x.id===id));
          }
          for(const ses of data.sessions){
            assert(ses.id&&ses.title&&ses.subject&&ses.domain&&ses.subdomain&&ses.sequence);
            assert(Array.isArray(ses.resources));
            assert(data.sequences.some(x=>x.id===ses.sequence&&x.sessions.includes(ses.id)));
            for(const res of ses.resources)assert(res.id&&res.type&&res.label&&res.url);
          }
          for(const subject of data.subjects){
            for(const domain of subject.domains){
              for(const sub of domain.subdomains||[]){
                assert(Array.isArray(sub.sequenceIds));
                for(const id of sub.sequenceIds)assert(data.sequences.some(x=>x.id===id));
              }
            }
          }
          const js=fs.readFileSync('assets/js/site.js','utf8');
          for(const marker of ['seq.demo?', 'ses.demo?', 'sess.demo?', 'r.session.demo?']){
            assert(js.includes(marker),'Etiquette de démonstration non conditionnelle : '+marker);
          }
          const copy=JSON.parse(JSON.stringify(data));
          const mat=copy.subjects.find(x=>x.id==='mathematiques');
          const domain=mat.domains.find(x=>x.id==='nombres');
          const sub=domain.subdomains[0];
          const seq={id:'essai-integre-seq',title:'Séquence réelle',sessions:['essai-integre-ses']};
          const ses={id:'essai-integre-ses',subject:mat.id,domain:domain.id,subdomain:sub.id,sequence:seq.id,number:'S01',title:'Séance réelle',classe:mat.classes[0],description:'Leçon',resources:[{id:'res-essai',type:'pdf',label:'Support',url:'documents/mathematiques/nombres/s1/essai.pdf'}]};
          copy.sequences.push(seq);copy.sessions.push(ses);sub.sequenceIds.push(seq.id);
          assert(copy.sequences.some(x=>x.id===seq.id));
          assert(copy.sessions.some(x=>x.id===ses.id));
          assert(sub.sequenceIds.includes(seq.id));
          assert.equal(data.subjects.length,7);
          console.log('OK — 7 matières, données historiques conservées, ajout de séance compatible, démonstrations préservées');
          JS
